####
# Display
##

#lvgl:
#  widgets:
#    - label:
#        align: CENTER
#        text: 'Hello World!'

display:
  - platform: inkplate
    id: inkplate_display
    model: inkplate_10
    #greyscale: True
    partial_updating: True
    auto_clear_enabled: False
    update_interval: never
    #update_interval: 1min
    full_update_every: 0
    #full_update_every: 480

    ckv_pin: 32
    sph_pin: 33
    gmod_pin:
      pca6416a: pca6416a_hub
      number: 1
    gpio0_enable_pin:
      pca6416a: pca6416a_hub
      number: 8
    oe_pin:
      pca6416a: pca6416a_hub
      number: 0
    spv_pin:
      pca6416a: pca6416a_hub
      number: 2
    powerup_pin:
      pca6416a: pca6416a_hub
      number: 4
    wakeup_pin:
      pca6416a: pca6416a_hub
      number: 3
    vcom_pin:
      pca6416a: pca6416a_hub
      number: 5
    pages:
      - id: whitepage
        lambda: |-
          it.fill(COLOR_ON);
      - id: ss_logo
        lambda: |-
          it.fill(COLOR_ON);
          it.image(it.get_width()/2, it.get_height()/2, id(ss_logo_big_black), ImageAlign::CENTER);
          it.printf(it.get_width()/2, 100, id(medium), COLOR_OFF, TextAlign::CENTER, "Welcome to");
          //it.strftime(it.get_width()/2, 800, id(helvetica_48), COLOR_OFF, TextAlign::CENTER, "%A, %B %d %Y", id(esptime).now());
      - id: weather_page1
        lambda: |-
          it.fill(COLOR_ON);
          //it.line(400, 0, 400, 600, COLOR_OFF);

          // Map weather states to MDI characters.
          std::map<std::string, std::string> weather_icon_map
          {
            {"cloudy", "\U000F0590"},
            {"cloudy-alert", "\U000F0F2F"},
            {"exceptional", "\U000F0F2F"},
            {"cloudy-arrow-right", "\U000F0E6E"},
            {"fog", "\U000F0591"},
            {"hail", "\U000F0592"},
            {"hazy", "\U000F0F30"},
