esphome:
  name: e-paper-infoscreen
  friendly_name: E-paper Infoscreen

  on_boot:
    - then:
        # read the RTC time once when the system boots
        - pcf85063.read_time:
    # once everything is set up: on a cold boot (power-on / reset, not a
    # deep-sleep wakeup) show the welcome screen, then draw the weather as
    # soon as the HA data has arrived instead of waiting for the 60s interval.
    # Deep-sleep wakeups keep the last weather screen up until new data is in.
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED;'
            then:
              - logger.log: "e-ink display - cold boot, showing welcome screen"
              - display.page.show: ss_logo
              - component.update: inkplate_display
        - wait_until:
            condition:
              binary_sensor.is_on: weather_data_ready
            timeout: 120s
        - script.execute: mainLoop

esp32:
  board: esp-wrover-kit
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"

external_components:
#  - source:
#      type: git
#      url: https://github.com/karlg100/esphome-display-screenshot
#      ref: inkplate-support
#    components: [display_capture]
#    refresh: always

  # equivalent shorthand for GitHub
#  - source: github://karlg100/esphome@dev
#  - source: github://karlg100/esphome@inkplatedisplay_sleep_buffer
#    components: [ inkplate6 ]
#    refresh: always

logger:
#  level: VERBOSE
#  logs:
#    inkplate: VERBOSE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.1.138
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
#  ap:
#    ssid: "E-Paper-Infoscreen"
#    password: !secret e_paper_infoscreen_fallback_password

#captive_portal:

web_server:
  port: 80

# Enable Home Assistant API
api:
  encryption:
    key: !secret e_paper_infoscreen_api_key
#  on_client_connected:
#    - component.update: inkplate_display
#  on_client_disconnected:
#    - component.update: inkplate_display

ota:
  - platform: esphome
    password: !secret e_paper_infoscreen_ota_password

time:
  - platform: pcf85063
    id: esptime
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never
  - platform: homeassistant
    id: ha_time
    # one full (black/white) refresh a night to clear partial-update ghosting,
    # while nobody is looking; all other redraws are flicker-free partial updates
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - logger.log: "e-ink display - nightly full refresh"
          - lambda: id(inkplate_display).block_partial();
          - component.update: inkplate_display
    # instead try to synchronize via network repeatedly ...
    on_time_sync:
      then:
        # ... and update the RTC when the synchronization was successful
        pcf85063.write_time:
#time:
#  - platform: sntp
#    id: esptime

psram:

# set once the first real screen has been drawn after boot
globals:
  - id: initial_draw_done
    type: bool
    restore_value: no
    initial_value: 'false'

# last time the HA API was connected (for the "offline since" note)
  - id: last_api_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_api_ok_str
    type: std::string
    restore_value: no
    initial_value: '""'

# which body page is showing (0 = today, 1 = 5-day); advanced every 10 minutes
  - id: page_idx
    type: int
    restore_value: no
    initial_value: '0'

deep_sleep:
#  run_duration: alwasy
  id: deep_sleep_1
  sleep_duration: 10s
  wakeup_pin: GPIO36
  wakeup_pin_mode: INVERT_WAKEUP
i2c:

pca6416a:
  - id: pca6416a_hub
    address: 0x20
  - id: pca6416a_hub2
    address: 0x21

####
# Switches to expose in HA
##

switch:
  - platform: restart
    name: "Inkplate Reboot"
    id: reboot

  - platform: gpio
    id: battery_read_mosfet
    pin:
      pca6416a: pca6416a_hub
      number: 9
      #inverted: true

#  - platform: homeassistant
#    name: "Inkplate Cache Values"
#    id: cache_values
#    entity_id: switch.inkplate_cache_values
#    restore_mode: RESTORE_DEFAULT_OFF

#  - platform: template
#    name: "Inkplate Greyscale mode"
#    lambda: return id(inkplate_display).get_greyscale();
#    turn_on_action:
#      - lambda: id(inkplate_display).set_greyscale(true);
#    turn_off_action:
#      - lambda: id(inkplate_display).set_greyscale(false);
#    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Inkplate Partial Updating"
    lambda: return id(inkplate_display).get_partial_updating();
    turn_on_action:
      - lambda: id(inkplate_display).set_partial_updating(true);
    turn_off_action:
      - lambda: id(inkplate_display).set_partial_updating(false);
    # a template switch defaults to ALWAYS_OFF, which ran turn_off_action on every
    # boot and silently disabled partial updates (every redraw flashed black/white)
    restore_mode: ALWAYS_ON

button:
  - platform: template
    name: Update display
    icon: mdi:update
    id: update_display
    on_press:
      - logger.log: "e-ink display updating"
      - component.update: inkplate_display

  - platform: template
    name: Deep Sleep display
    icon: mdi:sleep
    id: deepsleep_display
    on_press:
      - logger.log: "e-ink display entering deep sleep"
      - deep_sleep.enter: deep_sleep_1

  - platform: template
    name: Execute Main Loop
    icon: mdi:run-fast
    id: run_mainloop
    on_press:
      - script.execute: mainLoop

####
# Sensors to push to HA
##


sensor:
  - platform: homeassistant
    id: refresh_count
    entity_id: input_number.e_ink_refresh_count
    #restore_data: true

  - platform: template
    name: "Wakeup Cause"
    accuracy_decimals: 0
    lambda: return esp_sleep_get_wakeup_cause();

  - platform: adc
    pin: 35
    id: battery_voltage_adc
    name: "Voltage"
#    update_interval: 1s
    update_interval: never
    #internal: true
    accuracy_decimals: 2
    attenuation: 12dB
    samples: 10
    entity_category: "diagnostic"
    device_class: "voltage"
    filters:
      # transform the raw value (voltage divider) to actual voltage:
#      - multiply: 2.04
      # remove outliers (voltage spikes only):
      - quantile:
          window_size: 7
          send_every: 4
          send_first_at: 3
          quantile: .25
    # automatically enter deep-sleep below 3.2V:
#    on_value_range:
#      below: 3.2
#      then:
#        - text_sensor.template.publish:
#            id: sleep_state
#            state: "Deep Sleep (low voltage)"
#        - script.execute: prepare_for_sleep

  - platform: template
    name: "Inkplate Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      id(battery_read_mosfet).turn_on();
      delay(5);
      float adc = id(battery_voltage_adc).sample();
      id(battery_read_mosfet).turn_off();
      return adc;
    update_interval: never
    #update_interval: 5sec
    filters:
      - multiply: 2.04
    on_value:
      then:
        - component.update: battery_percent
        - component.update: battery_status

  - platform: template
    name: "Battery %"
    id: battery_percent
    lambda: return id(battery_voltage).state;
    update_interval: never
    accuracy_decimals: 0
    unit_of_measurement: "%"
    icon: mdi:battery-medium
    entity_category: "diagnostic"
    device_class: "battery"
    filters:
      # map battery voltages to associated SOC percentages:
      - calibrate_linear:
         method: exact
         datapoints:
          - 0.00 -> 0.0
          - 3.30 -> 1.0
          - 3.39 -> 10.0
          - 3.75 -> 50.0
          - 4.08 -> 97.0
          - 4.11 -> 99.0
          - 4.20 -> 100.0
      # cap at 100%
      - clamp:
          min_value: 0
          max_value: 100
          ignore_out_of_range: true
      # remove outliers (both directions):
      - median:
          window_size: 7
          send_every: 4
          send_first_at: 3

  ####
  # Weather Data Sensors
  ##
  # current
  - platform: homeassistant
    entity_id: weather.khie
    id: khie_temp
    attribute: temperature
    internal: true
    #restore_data: true

  - platform: homeassistant
    entity_id: weather.khie
    id: khie_humidity
    attribute: humidity
    internal: true
    #restore_data: true

  - platform: homeassistant
    id: cur_temp
    entity_id: sensor.current_temperature
    internal: true
    #restore_data: true

  - platform: homeassistant
    id: wind_chill
    entity_id: sensor.knhlanca3_wind_chill
    internal: true
    #restore_data: true

  - platform: homeassistant
    id: heat_index
    entity_id: sensor.knhlanca3_heat_index
    internal: true

  - platform: homeassistant
    id: cur_humidity
    entity_id: sensor.current_humidity
    internal: true
    #restore_data: true

  - platform: homeassistant
    id: cur_pressure
    entity_id: sensor.current_pressure
    internal: true
    #restore_data: true

  - platform: homeassistant
    id: cur_visability
    entity_id: sensor.current_visability
    internal: true
    #restore_data: true

  - platform: homeassistant
    id: cur_wind_gusts
    entity_id: sensor.current_wind_gusts
    internal: true
    #restore_data: true

  - platform: homeassistant
    entity_id: sensor.current_wind_speed
    id: current_wind_speed
    internal: true
    #restore_data: true

  - platform: homeassistant
    entity_id: sensor.current_wind_bearing
    id: wind_bearing
    internal: true
    #restore_data: true

  - platform: homeassistant
    entity_id: sensor.knhlanca3_precipitation_rate
    id: precip_forecast
    internal: true
    #restore_data: true

#  - platform: homeassistant
#    entity_id: weather.khie
#    id: current_wind_direction
#    attribute: wind_bearing

  - platform: template
    name: "Weather Underground Real Feel"
    id: cur_realfeel_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    lambda: |-
      // Check if all sensors have valid data to avoid 'NaN' errors
      if (id(cur_temp).has_state() && id(wind_chill).has_state() && id(heat_index).has_state()) {
        float temp = id(cur_temp).state;

        // Logic: Use Wind Chill if cold, Heat Index if hot, otherwise Air Temp
        if (temp <= 50.0) {
          return id(wind_chill).state;
        } else if (temp >= 80.0) {
          return id(heat_index).state;
        } else {
          return temp;
        }
      }
      return NAN;
#    update_interval: 60s
    internal: true


