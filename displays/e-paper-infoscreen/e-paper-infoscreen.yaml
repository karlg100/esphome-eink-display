button:
  - platform: template
    name: Update display
    icon: mdi:update
    id: update_display
    on_press:
      - logger.log: "e-ink display updating"
      - component.update: inkplate_display

  - platform: template
    name: Deep Sleep display
    icon: mdi:sleep
    id: deepsleep_display
    on_press:
      - logger.log: "e-ink display entering deep sleep"   
      - deep_sleep.enter: deep_sleep_1

  - platform: template
    name: Execute Main Loop
    icon: mdi:run-fast
    id: run_mainloop
    on_press:
      - script.execute: mainLoop

####
# Sensors to push to HA
##


sensor:
  - platform: homeassistant
    id: refresh_count
    entity_id: input_number.e_ink_refresh_count
    #restore_data: true

  - platform: template
    name: "Wakeup Cause"
    accuracy_decimals: 0
    lambda: return esp_sleep_get_wakeup_cause();

  - platform: adc
    pin: 35
    id: battery_voltage_adc
    name: "Voltage"
#    update_interval: 1s
    update_interval: never
    #internal: true
    accuracy_decimals: 2
    attenuation: 12dB
    samples: 10
    entity_category: "diagnostic"
    device_class: "voltage"
    filters:
      # transform the raw value (voltage divider) to actual voltage:
#      - multiply: 2.04
      # remove outliers (voltage spikes only):
      - quantile:
          window_size: 7
          send_every: 4
          send_first_at: 3
          quantile: .25
    # automatically enter deep-sleep below 3.2V:
#    on_value_range:
#      below: 3.2
#      then:
#        - text_sensor.template.publish:
#            id: sleep_state
#            state: "Deep Sleep (low voltage)"
#        - script.execute: prepare_for_sleep

  - platform: template
    name: "Inkplate Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      id(battery_read_mosfet).turn_on();
      delay(5);
      float adc = id(battery_voltage_adc).sample();
      id(battery_read_mosfet).turn_off();
      return adc;
    update_interval: never
    #update_interval: 5sec
    filters:
      - multiply: 2.04
    on_value:
      then:
        - component.update: battery_percent
        - component.update: battery_status

  - platform: template
    name: "Battery %"
    id: battery_percent
    lambda: return id(battery_voltage).state;
    update_interval: never
    accuracy_decimals: 0
    unit_of_measurement: "%"
    icon: mdi:battery-medium    
    entity_category: "diagnostic"
    device_class: "battery"
    filters:
      # map battery voltages to associated SOC percentages:
      - calibrate_linear:
         method: exact
         datapoints:
          - 0.00 -> 0.0
          - 3.30 -> 1.0
          - 3.39 -> 10.0
          - 3.75 -> 50.0
          - 4.08 -> 97.0
          - 4.11 -> 99.0
          - 4.20 -> 100.0
      # cap at 100%
      - clamp:
          min_value: 0
          max_value: 100
          ignore_out_of_range: true
      # remove outliers (both directions):
      - median:
          window_size: 7
          send_every: 4
          send_first_at: 3

