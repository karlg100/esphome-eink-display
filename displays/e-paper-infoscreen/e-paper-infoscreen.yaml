
esphome:
  name: e-paper-infoscreen
  friendly_name: E-paper Infoscreen

  on_boot:
    then:
      # read the RTC time once when the system boots
      pcf85063.read_time:

esp32:
  board: esp-wrover-kit
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced: 
      minimum_chip_revision: "3.0"

external_components:
  - source:
      type: git
      url: https://github.com/karlg100/esphome-display-screenshot
      ref: inkplate-support
    components: [display_capture]
    refresh: always

  # equivalent shorthand for GitHub
#  - source: github://karlg100/esphome@dev
#  - source: github://karlg100/esphome@inkplatedisplay_sleep_buffer
#    components: [ inkplate6 ]
#    refresh: always

logger:
#  level: VERBOSE
#  logs:
#    inkplate: VERBOSE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.1.138
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
#  ap:
#    ssid: "E-Paper-Infoscreen"
#    password: !secret e_paper_infoscreen_fallback_password

#captive_portal:

web_server:
  port: 80

# Enable Home Assistant API
api:
  encryption:
    key: !secret e_paper_infoscreen_api_key
#  on_client_connected:
#    - component.update: inkplate_display
#  on_client_disconnected:
#    - component.update: inkplate_display

ota:
  - platform: esphome
    password: !secret e_paper_infoscreen_ota_password

time:
  - platform: pcf85063
    id: esptime
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never
  - platform: homeassistant
    # instead try to synchronize via network repeatedly ...
    on_time_sync:
      then:
        # ... and update the RTC when the synchronization was successful
        pcf85063.write_time:
#time:
#  - platform: sntp
#    id: esptime

psram:

deep_sleep:
#  run_duration: alwasy
  id: deep_sleep_1
  sleep_duration: 10s
  wakeup_pin: GPIO36
  wakeup_pin_mode: INVERT_WAKEUP
i2c:

pca6416a:
  - id: pca6416a_hub
    address: 0x20
  - id: pca6416a_hub2
    address: 0x21

