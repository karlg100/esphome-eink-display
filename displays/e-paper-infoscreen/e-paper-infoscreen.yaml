  - platform: template
    name: "Wind Direction"
    update_interval: never
    id: current_wind_direction
    lambda: |-
      if (id(wind_bearing).state >= 348.75 || id(wind_bearing).state < 11.25) {
        return std::string("N");
      } else if (id(wind_bearing).state >= 11.25 && id(wind_bearing).state < 33.75) {
        return std::string("NNE");
      } else if (id(wind_bearing).state >= 33.75 && id(wind_bearing).state < 56.25) {
        return std::string("NE");
      } else if (id(wind_bearing).state >= 56.25 && id(wind_bearing).state < 78.75) {
        return std::string("ENE");
      } else if (id(wind_bearing).state >= 78.75 && id(wind_bearing).state < 101.25) {
        return std::string("E");
      } else if (id(wind_bearing).state >= 101.25 && id(wind_bearing).state < 123.75) {
        return std::string("ESE");
      } else if (id(wind_bearing).state >= 123.75 && id(wind_bearing).state < 146.25) {
        return std::string("SE");
      } else if (id(wind_bearing).state >= 146.25 && id(wind_bearing).state < 168.75) {
        return std::string("SSE");
      } else if (id(wind_bearing).state >= 168.75 && id(wind_bearing).state < 191.25) {
        return std::string("S");
      } else if (id(wind_bearing).state >= 191.25 && id(wind_bearing).state < 213.75) {
        return std::string("SSW");
      } else if (id(wind_bearing).state >= 213.75 && id(wind_bearing).state < 236.25) {
        return std::string("SW");
      } else if (id(wind_bearing).state >= 236.25 && id(wind_bearing).state < 258.75) {
        return std::string("WSW");
      } else if (id(wind_bearing).state >= 258.75 && id(wind_bearing).state < 281.25) {
        return std::string("W");
      } else if (id(wind_bearing).state >= 281.25 && id(wind_bearing).state < 303.75) {
        return std::string("WNW");
      } else if (id(wind_bearing).state >= 303.75 && id(wind_bearing).state < 326.25) {
        return std::string("NW");
      } else if (id(wind_bearing).state >= 326.25 && id(wind_bearing).state < 348.75) {
        return std::string("NNW");
      } else {
        return std::string("Unknown");
      }


