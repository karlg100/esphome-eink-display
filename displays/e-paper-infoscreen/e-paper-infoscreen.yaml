text_sensor:
# refresh the display when the HA "Refresh forecast" button is pressed.
# HA also sends this sensor's current value right after connecting; that one is
# ignored (initial_draw_done is still false) so it can't draw a half-loaded page.
  - platform: homeassistant
    id: refresh_forecast_button
    entity_id: input_button.refresh_forecast
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return id(initial_draw_done);'
          then:
            - logger.log: "e-ink display - refresh button pressed"
            - globals.set:
                id: draw_now
                value: 'true'
            - script.execute: mainLoop

  # page override for testing (input_select.e_ink_page): auto = normal rotation,
  # anything else pins that page even when it's out of season
  - platform: homeassistant
    id: page_override
    entity_id: input_select.e_ink_page
    internal: true
    on_value:
      - lambda: |-
          int f = -1;
          if (x == "today") f = 0; else if (x == "5-day") f = 1; else if (x == "hikes") f = 2;
          else if (x == "santa") f = 3;
          if (f >= 0) {
            id(page_idx) = f;
            if (f == 2) id(hike_set) = (id(hike_set) + 1) % 3;
          }
          id(draw_now) = true;
      - if:
          condition:
            lambda: 'return id(initial_draw_done);'
          then:
            - script.execute: mainLoop

  # IR request from HA (input_select.e_ink_ir_request): "on" / "off" sends the
  # ambiance codes, then reports back through "IR last sent" so HA can clear the
  # request. HA keeps the frame awake while a request is waiting, and the frame
  # picks it up when it wakes (HA sends the current value on connect).
  - platform: homeassistant
    id: ir_request
    entity_id: input_select.e_ink_ir_request
    internal: true
    on_value:
      - if:
          condition:
            lambda: 'return x == "on";'
          then:
            - logger.log: "IR: ambiance on"
            - script.execute: ir_all_on
            - script.wait: ir_all_on
            - text_sensor.template.publish:
                id: ir_last_sent
                state: !lambda 'return "on " + id(esptime).now().strftime("%Y-%m-%d %H:%M");'
      - if:
          condition:
            lambda: 'return x == "off";'
          then:
            - logger.log: "IR: ambiance off"
            - script.execute: ir_candles_off
            - script.wait: ir_candles_off
            - text_sensor.template.publish:
                id: ir_last_sent
                state: !lambda 'return "off " + id(esptime).now().strftime("%Y-%m-%d %H:%M");'

  - platform: template
    id: ir_last_sent
    name: "IR last sent"
    icon: mdi:remote
    update_interval: never

  # awake / night / vacant, decided in HA (sensor.e_ink_power_mode)
  - platform: homeassistant
    id: power_mode
    entity_id: sensor.e_ink_power_mode
    internal: true

  - platform: debug
    reset_reason:
      name: "Reset reason"

# log system state: running or deep sleep (and reason)
  - platform: template
    name: "DeepSleep State"
    id: sleep_state
    icon: "mdi:power-sleep"
    entity_category: "diagnostic"
    device_class: ""

  # log power mode: USB or battery
  - platform: template
    name: "Battery Status"
    id: battery_status
    update_interval: never
    entity_category: "diagnostic"
    device_class: ""
    icon: mdi:power-plug-battery
    lambda: |-
      if (id(battery_voltage).state > 4.74) {
        return {"USB"};
      } else if (id(battery_voltage).state > 4.18) {
        if (id(battery_voltage).state > 4.5) {
           return {"Constant Voltage"};
        } else {
           return {"Constant Current"};
        }
      } else {
        return {"Battery"};
      }

# hot tub
  - platform: homeassistant
    id: hottub_action
    entity_id: climate.stargazer_s_spa_thermostat_1
    attribute: hvac_action

# weather
  - platform: homeassistant
    id: cur_conditions
    entity_id: weather.knhlanca3

  - platform: homeassistant
    id: cur_forecast
    entity_id: sensor.chatgpt_forecast_8_hours
    attribute: forecast
    #entity_id: sensor.mountain_house_forecast_condition_day_0

  - platform: homeassistant
    id: d0_conditions
    entity_id: sensor.forecast_day_1_weather

  - platform: homeassistant
    id: d1_conditions
    entity_id: sensor.forecast_day_2_weather

  - platform: homeassistant
    id: d2_conditions
    entity_id: sensor.forecast_day_3_weather

  - platform: homeassistant
    id: d3_conditions
    entity_id: sensor.forecast_day_4_weather

  - platform: homeassistant
    id: d4_conditions
    entity_id: sensor.forecast_day_5_weather

  # Hourly conditions
  - platform: homeassistant
    id: h1_conditions
    entity_id: sensor.forecast_hour_1_weather

  - platform: homeassistant
    id: h1_hour
    entity_id: sensor.forecast_hour_1_weather
    attribute: time

  - platform: homeassistant
    id: h2_conditions
    entity_id: sensor.weather_forecast_h2_2

  - platform: homeassistant
    id: h2_hour
    entity_id: sensor.weather_forecast_h2_2
    attribute: time

  - platform: homeassistant
    id: h3_conditions
    entity_id: sensor.weather_forecast_h3_2

  - platform: homeassistant
    id: h3_hour
    entity_id: sensor.weather_forecast_h3_2
    attribute: time

  - platform: homeassistant
    id: h4_conditions
    entity_id: sensor.weather_forecast_hour_4

  - platform: homeassistant
    id: h4_hour
    entity_id: sensor.weather_forecast_hour_4
    attribute: time

  - platform: homeassistant
    id: h5_conditions
    entity_id: sensor.weather_forecast_hour_5

  - platform: homeassistant
    id: h5_hour
    entity_id: sensor.weather_forecast_hour_5
    attribute: time

  - platform: template
    name: "Wind Direction"
    update_interval: never
    id: current_wind_direction
    lambda: |-
      if (id(wind_bearing).state >= 348.75 || id(wind_bearing).state < 11.25) {
        return std::string("N");
      } else if (id(wind_bearing).state >= 11.25 && id(wind_bearing).state < 33.75) {
        return std::string("NNE");
      } else if (id(wind_bearing).state >= 33.75 && id(wind_bearing).state < 56.25) {
        return std::string("NE");
      } else if (id(wind_bearing).state >= 56.25 && id(wind_bearing).state < 78.75) {
        return std::string("ENE");
      } else if (id(wind_bearing).state >= 78.75 && id(wind_bearing).state < 101.25) {
        return std::string("E");
      } else if (id(wind_bearing).state >= 101.25 && id(wind_bearing).state < 123.75) {
        return std::string("ESE");
      } else if (id(wind_bearing).state >= 123.75 && id(wind_bearing).state < 146.25) {
        return std::string("SE");
      } else if (id(wind_bearing).state >= 146.25 && id(wind_bearing).state < 168.75) {
        return std::string("SSE");
      } else if (id(wind_bearing).state >= 168.75 && id(wind_bearing).state < 191.25) {
        return std::string("S");
      } else if (id(wind_bearing).state >= 191.25 && id(wind_bearing).state < 213.75) {
        return std::string("SSW");
      } else if (id(wind_bearing).state >= 213.75 && id(wind_bearing).state < 236.25) {
        return std::string("SW");
      } else if (id(wind_bearing).state >= 236.25 && id(wind_bearing).state < 258.75) {
        return std::string("WSW");
      } else if (id(wind_bearing).state >= 258.75 && id(wind_bearing).state < 281.25) {
        return std::string("W");
      } else if (id(wind_bearing).state >= 281.25 && id(wind_bearing).state < 303.75) {
        return std::string("WNW");
      } else if (id(wind_bearing).state >= 303.75 && id(wind_bearing).state < 326.25) {
        return std::string("NW");
      } else if (id(wind_bearing).state >= 326.25 && id(wind_bearing).state < 348.75) {
        return std::string("NNW");
      } else {
        return std::string("");
      }


binary_sensor:
  - platform: status
    name: "Inkplate Status"
    id: system_status
#  - platform: gpio
#    name: "Inkplate Touch Pad 1"
#    pin:
#      pca6416a: pca6416a_hub
#      number: 10
#  - platform: gpio
#    name: "Inkplate Touch Pad 2"
#    pin:
#      pca6416a: pca6416a_hub
#      number: 11
#  - platform: gpio
#    name: "Inkplate Touch Pad 3"
#    pin:
#      pca6416a: pca6416a_hub
#      number: 12

  # true once the key HA values have arrived, so the weather page is never
  # drawn half-loaded (the "nan" screen right after boot)
  - platform: template
    id: weather_data_ready
    internal: true
    lambda: |-
      return !std::isnan(id(cur_temp).state) &&
             !std::isnan(id(h1_temp).state) &&
             !std::isnan(id(hottub_temp).state) &&
             id(cur_conditions).has_state() &&
             id(h1_hour).has_state();

  # seasonal page eligibility. Hiking: no snow on the ground at the house
  - platform: template
    id: hikes_ok
    name: "Show hiking page"
    lambda: 'return id(snow_depth_in).has_state() && id(snow_depth_in).state < 1.0;'

  - platform: homeassistant
    id: hottub_pump
    entity_id: fan.stargazer_s_spa_pump_1

  - platform: homeassistant
    id: hottub_light
    entity_id: light.stargazer_s_spa_light_1

  - platform: homeassistant
    id: hottub_cleaning
    entity_id: binary_sensor.stargazer_s_spa_filtration

  # page flip buttons: the onboard WAKE button, and a button on the frame wired
  # from IO39 to GND (IO39 is shared with the RTC interrupt line, which has the
  # board's pull-up and is unused here). Both also wake the frame from sleep.
  - platform: gpio
    id: wake_button
    name: "Wake button"
    pin:
      number: GPIO36
      inverted: true
      allow_other_uses: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - script.execute: button_flip
  - platform: gpio
    id: frame_button
    name: "Frame button"
    pin:
      number: GPIO39
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_press:
      - script.execute: button_flip

  # main floor motion (the main thermostat's HomeKit motion sensor) - the floor
  # the frame hangs on. Someone walking in redraws right away, quietly.
  - platform: homeassistant
    id: main_floor_motion
    entity_id: binary_sensor.mountain_house_motion
    on_press:
      - if:
          condition:
            lambda: 'return id(initial_draw_done);'
          then:
            - logger.log: "e-ink display - main floor motion, refreshing"
            - globals.set:
                id: draw_now
                value: 'true'
            - script.execute: mainLoop

  # on while there has been main floor motion in the last hour. When off nobody
  # is watching: skip the minute-by-minute redraws, and the 10-minute page
  # changes use a full refresh (no one sees the flash, and it clears ghosting).
  - platform: homeassistant
    id: main_floor_recent
    entity_id: binary_sensor.mountain_house_motion
    filters:
      - delayed_off: 60min
