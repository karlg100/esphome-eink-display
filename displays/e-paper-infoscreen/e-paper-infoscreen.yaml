    entity_id: sensor.current_wind_gusts
    internal: true
    #restore_data: true

  - platform: homeassistant
    entity_id: sensor.current_wind_speed
    id: current_wind_speed
    internal: true
    #restore_data: true

  - platform: homeassistant
    entity_id: sensor.current_wind_bearing
    id: wind_bearing
    internal: true
    #restore_data: true

  - platform: homeassistant
    entity_id: sensor.knhlanca3_precipitation_rate
    id: precip_forecast
    internal: true
    #restore_data: true

#  - platform: homeassistant
#    entity_id: weather.khie
#    id: current_wind_direction
#    attribute: wind_bearing

  - platform: template
    name: "Weather Underground Real Feel"
    id: cur_realfeel_temp
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    lambda: |-
      // Check if all sensors have valid data to avoid 'NaN' errors
      if (id(cur_temp).has_state() && id(wind_chill).has_state() && id(heat_index).has_state()) {
        float temp = id(cur_temp).state;

        // Logic: Use Wind Chill if cold, Heat Index if hot, otherwise Air Temp
        if (temp <= 50.0) {
          return id(wind_chill).state;
        } else if (temp >= 80.0) {
          return id(heat_index).state;
        } else {
          return temp;
        }
      }
      return NAN;
#    update_interval: 60s
    internal: true


