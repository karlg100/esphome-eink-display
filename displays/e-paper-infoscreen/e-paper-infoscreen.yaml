display_capture:
  display_id: inkplate_display
  backend: inkplate

interval:
  - interval: 60s
    then:
      - script.execute: mainLoop

remote_transmitter:
  carrier_duty_percent: 50%
  pin: GPIO12
#  pin:
#    pca6416a: pca6416a_hub2
#    number: 1

## Main Loop
script:
#  - id: fullRefreshCheck
#    then:
#      - if:
#        condition:
#        refresh_count
  - id: mainLoop
    then:
      - logger.log: "e-ink display - interval start"
      - component.update: battery_voltage
      - if:
          condition:
            - binary_sensor.is_on: eink_sleep_mode
          then:
            - logger.log: "e-ink display -  eink_sleep_mode on"
          else:
            - logger.log: "e-ink display -  eink_sleep_mode off"
      - if:
          condition:
            - api.connected:
          then:
            - logger.log: "e-ink display -  api connected"
          else:
            - logger.log: "e-ink display -  api disconnected"
      - if:
          condition:
            - binary_sensor.is_on: secondfloor_occupied
          then:
            - logger.log: "e-ink display -  occuancy detected"
          else:
            - logger.log: "e-ink display -  occuancy not detected"

      # check if we should be in sleep mode (logo display and then check if we should be sleepy and sleep)
      - if:
          condition:
            - binary_sensor.is_on: eink_sleep_mode
          then:
            - logger.log: "e-ink display - showing logo"
# KAG mod            - lambda: id(inkplate_display).set_skip_reset(true);
#            - lambda: id(inkplate_display).set_partial_updating(false);
            - display.page.show: ss_logo
            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display

      # if we are not in sleep mode, check for API connetion and occupancy, then update if all true
      - if:
          condition:
            - not:
              - binary_sensor.is_on: eink_sleep_mode
            - api.connected:
#            - binary_sensor.is_on: secondfloor_occupied
          then:
            - logger.log: "e-ink display - showing weather page"
            - component.update: current_wind_direction
#            - if:
# KAG MOD            - lambda: id(inkplate_display).set_skip_reset(true);
            - display.page.show: weather_page1
            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display
#            - component.update: inkplate_display

# decide which sleep mode to go into
# sleepy and occupied, short sleep
      - if:
          condition:
            - binary_sensor.is_on: eink_sleepy_mode
            - binary_sensor.is_on: secondfloor_occupied
            - not:
              - binary_sensor.is_on: eink_sleep_mode
          then:
            - logger.log: "e-ink display - deep sleeing for short time"
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: 300s
# sleepy and unoccupied, but not hibernated, medium sleep
      - if:
          condition:
            - binary_sensor.is_on: eink_sleepy_mode
            - not:
              - binary_sensor.is_on: eink_sleep_mode
              - binary_sensor.is_on: secondfloor_occupied
          then:
            - logger.log: "e-ink display - deep sleeing for medium time"
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: 900s
      - if:
          condition:
            - binary_sensor.is_on: eink_sleep_mode
            - binary_sensor.is_on: eink_sleepy_mode
          then:
            - logger.log: "e-ink display - deep sleeing for long time"
            - deep_sleep.enter:
                id: deep_sleep_1
                #sleep_duration: 300s
                until: "16:00:00"
                time_id: esptime



  - id: marcycandle_on
    then:
      - remote_transmitter.transmit_pronto: 
          data: "0000 006D 0022 0000 0161 00AC 0018 0014 0017 0014 0017 0014 0017 0015 0017 0014 0016 0015 0016 0015 0017 0014 0017 0041 0016 0041 0016 0041 0016 0041 0016 0041 0016 0041 0016 0041 0016 0041 0016 0015 0017 0015 0017 0015 0017 0015 0017 0015 0017 0015 0016 0016 0017 0015 0018 003E 0017 003F 0018 003E 0018 003E 0016 0040 0017 003F 0017 003F 0018 003E 0017 0181"
          repeat:
