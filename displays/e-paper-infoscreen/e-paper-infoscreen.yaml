    id: reboot

  - platform: gpio
    id: battery_read_mosfet
    pin:
      pca6416a: pca6416a_hub
      number: 9
      #inverted: true

#  - platform: homeassistant
#    name: "Inkplate Cache Values"
#    id: cache_values
#    entity_id: switch.inkplate_cache_values
#    restore_mode: RESTORE_DEFAULT_OFF

#  - platform: template
