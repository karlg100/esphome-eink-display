esphome:
  name: e-paper-infoscreen
  friendly_name: E-paper Infoscreen

  on_boot:
    - then:
        # read the RTC time once when the system boots
        - pcf85063.read_time:
    # once everything is set up: on a cold boot (power-on / reset, not a
    # deep-sleep wakeup) show the welcome screen, then draw the weather as
    # soon as the HA data has arrived instead of waiting for the 60s interval.
    # Deep-sleep wakeups keep the last weather screen up until new data is in.
    - priority: -100
      then:
        - if:
            condition:
              lambda: 'return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED;'
            then:
              - logger.log: "e-ink display - cold boot, showing welcome screen"
              - display.page.show: ss_logo
              - component.update: inkplate_display
        # woke from deep sleep with the last frame restored from flash: the
        # panel already shows it, so the next draw can be a quiet partial update
        - lambda: |-
            if (id(inkplate_display).frame_restored())
              id(initial_draw_done) = true;
            auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_EXT0 || cause == ESP_SLEEP_WAKEUP_EXT1) {
              // someone pressed the wake / frame button: stay up for a while and
              // show the next page (today's forecast after the night screen)
              id(awake_until_ms) = millis() + 10UL * 60UL * 1000UL;
              id(page_idx) = 0;
              id(draw_now) = true;
            }
        - wait_until:
            condition:
              binary_sensor.is_on: weather_data_ready
            timeout: 120s
        # the power mode comes from HA a moment after the API connects
        - wait_until:
            condition:
              lambda: 'return id(power_mode).has_state();'
            timeout: 20s
        - script.execute: mainLoop

esp32:
  board: esp-wrover-kit
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      # main loop task stack, 8 KB by default: the page lambdas plus the QR
      # code generator (a ~4 KB temp buffer on the stack) overflowed it
      # ("vApplicationStackOverflowHook" crash, then safe mode)
      loop_task_stack_size: 16384

external_components:
  # ESPHome's inkplate display driver (2026.10.2) plus saving the frame across
  # deep sleep, so wakes can redraw with quiet partial updates. See
  # displays/e-paper-infoscreen/components/inkplate/frame_store.cpp
  - source:
      type: git
      url: https://github.com/karlg100/esphome-eink-display
      ref: main
      path: displays/e-paper-infoscreen/components
    components: [inkplate]
    refresh: 1h
#  - source:
#      type: git
#      url: https://github.com/karlg100/esphome-display-screenshot
#      ref: inkplate-support
#    components: [display_capture]
#    refresh: always

  # equivalent shorthand for GitHub
#  - source: github://karlg100/esphome@dev
#  - source: github://karlg100/esphome@inkplatedisplay_sleep_buffer
#    components: [ inkplate6 ]
#    refresh: always

logger:
#  level: VERBOSE
#  logs:
#    inkplate: VERBOSE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: 192.168.1.138
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
#  ap:
#    ssid: "E-Paper-Infoscreen"
#    password: !secret e_paper_infoscreen_fallback_password

#captive_portal:

web_server:
  port: 80

# Enable Home Assistant API
api:
  encryption:
    key: !secret e_paper_infoscreen_api_key
#  on_client_connected:
#    - component.update: inkplate_display
#  on_client_disconnected:
#    - component.update: inkplate_display

ota:
  - platform: esphome
    password: !secret e_paper_infoscreen_ota_password

time:
  - platform: pcf85063
    id: esptime
    # repeated synchronization is not necessary unless the external RTC
    # is much more accurate than the internal clock
    update_interval: never
  - platform: homeassistant
    id: ha_time
    # one full (black/white) refresh a night to clear partial-update ghosting,
    # while nobody is looking; all other redraws are flicker-free partial updates
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - logger.log: "e-ink display - nightly full refresh"
          - lambda: id(inkplate_display).block_partial();
          - component.update: inkplate_display
    # instead try to synchronize via network repeatedly ...
    on_time_sync:
      then:
        # ... and update the RTC when the synchronization was successful
        pcf85063.write_time:
#time:
#  - platform: sntp
#    id: esptime

psram:

# set once the first real screen has been drawn after boot
globals:
  - id: initial_draw_done
    type: bool
    restore_value: no
    initial_value: 'false'

# last time the HA API was connected (for the "offline since" note)
  - id: last_api_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_api_ok_str
    type: std::string
    restore_value: no
    initial_value: '""'

# this mainLoop pass: awake / night / vacant, and whether to sleep after drawing
  - id: eff_mode
    type: std::string
    restore_value: no
    initial_value: '"awake"'
  - id: sleep_after_draw
    type: bool
    restore_value: no
    initial_value: 'false'

# a button press keeps the frame awake (no night / vacant sleep) until this time
  - id: awake_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Santa's Village open days, YYYYMMDD + open hour + close hour (24 h).
# 2026 Christmastime per santasvillage.com/park-info-tickets/dates-hours:
# Saturdays Nov 7 - Dec 19 and Fri Nov 27 11-7, Sundays Nov 22 - Dec 20 11-6,
# New Year's Eve 4-9. Update each fall; past dates are ignored.
  - id: santa_days
    type: std::vector<uint64_t>
    restore_value: no
    initial_value: >-
      {202611071119ULL, 202611141119ULL, 202611211119ULL, 202611221118ULL,
       202611271119ULL, 202611281119ULL, 202611291118ULL, 202612051119ULL,
       202612061118ULL, 202612121119ULL, 202612131118ULL, 202612191119ULL,
       202612201118ULL, 202612311621ULL}
# Santa's Village is open today (still) or within the next 3 days
  - id: santa_soon
    type: bool
    restore_value: no
    initial_value: 'false'

# which set of six hikes the hiking page shows (advances each time it comes up)
  - id: hike_set
    type: int
    restore_value: no
    initial_value: '2'
# last snow depth fetch attempt (retry every 10 min until one succeeds)
  - id: snow_try_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# which body page is showing (0 = today, 1 = 5-day, 2 = hikes); advanced every 10 minutes
  - id: page_idx
    type: int
    restore_value: no
    initial_value: '0'

# set when the next mainLoop should redraw even if the main floor is empty
# (page change, Next page / refresh buttons, someone walking in)
  - id: draw_now
    type: bool
    restore_value: no
    initial_value: 'false'

# reset reason / heap in HA, to see why the frame rebooted
debug:
  update_interval: 5min

# Power: awake during the day; deep sleep at night once every occupancy sensor
# is off (30 minute naps, forecast left on the screen) and between guests
# (welcome screen, wake 3 hours before the next arrival). Home Assistant decides:
# sensor.e_ink_power_mode / sensor.e_ink_sleep_seconds (template helpers).
# Turn on input_boolean.e_ink_stay_awake before an OTA update.
deep_sleep:
  id: deep_sleep_1
  sleep_duration: 30min
  # onboard WAKE button (active low)
  wakeup_pin:
    number: GPIO36
    inverted: true
    allow_other_uses: true
  wakeup_pin_mode: INVERT_WAKEUP
i2c:

pca6416a:
  - id: pca6416a_hub
    address: 0x20
  - id: pca6416a_hub2
    address: 0x21

####
# Switches to expose in HA
##

switch:
  - platform: restart
    name: "Inkplate Reboot"
    id: reboot

  - platform: gpio
    id: battery_read_mosfet
    pin:
      pca6416a: pca6416a_hub
      number: 9
      #inverted: true

#  - platform: homeassistant
#    name: "Inkplate Cache Values"
#    id: cache_values
#    entity_id: switch.inkplate_cache_values
#    restore_mode: RESTORE_DEFAULT_OFF

#  - platform: template
#    name: "Inkplate Greyscale mode"
#    lambda: return id(inkplate_display).get_greyscale();
#    turn_on_action:
#      - lambda: id(inkplate_display).set_greyscale(true);
#    turn_off_action:
#      - lambda: id(inkplate_display).set_greyscale(false);
#    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "Inkplate Partial Updating"
    lambda: return id(inkplate_display).get_partial_updating();
    turn_on_action:
      - lambda: id(inkplate_display).set_partial_updating(true);
    turn_off_action:
      - lambda: id(inkplate_display).set_partial_updating(false);
    # a template switch defaults to ALWAYS_OFF, which ran turn_off_action on every
    # boot and silently disabled partial updates (every redraw flashed black/white)
    restore_mode: ALWAYS_ON

button:
  # IR remote buttons (the IR LED on GPIO13)
  - platform: template
    name: "IR Fireplace power"
    icon: mdi:fireplace
    on_press:
      - script.execute: fireplace_power_40k
  - platform: template
    name: "IR Big candles on"
    icon: mdi:candle
    on_press:
      - script.execute: candles_on_38k
  - platform: template
    name: "IR Big candles off"
    icon: mdi:candle-off
    on_press:
      - script.execute: candles_off_38k
  - platform: template
    name: "IR Tea lights on"
    icon: mdi:candelabra-fire
    on_press:
      - script.execute: tealights_on
  - platform: template
    name: "IR Tea lights off"
    icon: mdi:candelabra
    on_press:
      - script.execute: tealights_off
  - platform: template
    name: "IR All candles on"
    icon: mdi:candle
    on_press:
      - script.execute: ir_candles_on
  - platform: template
    name: "IR All candles off"
    icon: mdi:candle-off
    on_press:
      - script.execute: ir_candles_off
  - platform: template
    name: "IR Everything on"
    icon: mdi:fire
    on_press:
      - script.execute: ir_all_on

  - platform: template
    name: Update display
    icon: mdi:update
    id: update_display
    on_press:
      - logger.log: "e-ink display updating"
      - component.update: inkplate_display

  - platform: template
    name: Deep Sleep display
    icon: mdi:sleep
    id: deepsleep_display
    on_press:
      - logger.log: "e-ink display entering deep sleep"
      - deep_sleep.enter: deep_sleep_1

  - platform: template
    name: Execute Main Loop
    icon: mdi:run-fast
    id: run_mainloop
    on_press:
      - globals.set:
          id: draw_now
          value: 'true'
      - script.execute: mainLoop

  - platform: template
    name: Next page
    icon: mdi:page-next-outline
    id: next_page_button
    on_press:
      - logger.log: "e-ink display - next page button"
      - script.execute: next_page

####
# Sensors to push to HA
##


sensor:
  - platform: homeassistant
    id: refresh_count
    entity_id: input_number.e_ink_refresh_count
    #restore_data: true

  # how long to sleep in night / vacant mode (sensor.e_ink_sleep_seconds)
  - platform: homeassistant
    id: sleep_seconds
    entity_id: sensor.e_ink_sleep_seconds
    internal: true

  # snow on the ground at the house, inches (Open-Meteo model, fetched every 3 h)
  - platform: template
    id: snow_depth_in
    name: "Snow depth at house"
    unit_of_measurement: "in"
    accuracy_decimals: 1
    icon: mdi:snowflake
    update_interval: never

  - platform: template
    name: "Wakeup Cause"
    accuracy_decimals: 0
    lambda: return esp_sleep_get_wakeup_cause();

  - platform: adc
    pin: 35
    id: battery_voltage_adc
    name: "Voltage"
#    update_interval: 1s
    update_interval: never
    #internal: true
    accuracy_decimals: 2
    attenuation: 12dB
    samples: 10
    entity_category: "diagnostic"
    device_class: "voltage"
    filters:
      # transform the raw value (voltage divider) to actual voltage:
#      - multiply: 2.04
      # remove outliers (voltage spikes only):
      - quantile:
          window_size: 7
          send_every: 4
          send_first_at: 3
          quantile: .25
    # automatically enter deep-sleep below 3.2V:
#    on_value_range:
#      below: 3.2
#      then:
#        - text_sensor.template.publish:
#            id: sleep_state
#            state: "Deep Sleep (low voltage)"
#        - script.execute: prepare_for_sleep

  - platform: template
    name: "Inkplate Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    lambda: |-
      // average a burst of samples so one reading is good enough on a short wake
      id(battery_read_mosfet).turn_on();
      delay(5);
      float sum = 0;
      for (int i = 0; i < 8; i++) sum += id(battery_voltage_adc).sample();
      id(battery_read_mosfet).turn_off();
      return sum / 8;
    update_interval: never
    #update_interval: 5sec
    filters:
      - multiply: 2.04
    on_value:
      then:
        - component.update: battery_percent
        - component.update: battery_status

  - platform: template
    name: "Battery %"
    id: battery_percent
    lambda: return id(battery_voltage).state;
    update_interval: never
    accuracy_decimals: 0
    unit_of_measurement: "%"
    icon: mdi:battery-medium
    entity_category: "diagnostic"
    device_class: "battery"
    filters:
      # map battery voltages to associated SOC percentages:
      - calibrate_linear:
         method: exact
         datapoints:
          - 0.00 -> 0.0
          - 3.30 -> 1.0
          - 3.39 -> 10.0
          - 3.75 -> 50.0
          - 4.08 -> 97.0
          - 4.11 -> 99.0
          - 4.20 -> 100.0
      # cap at 0..100% (ignore_out_of_range dropped charging readings above
      # 4.20 V, which left Battery % at "unknown")
      - clamp:
          min_value: 0
          max_value: 100

  ####
  # Weather Data Sensors
  ##
  # current
  - platform: homeassistant
    entity_id: weather.khie
    id: khie_temp
    attribute: temperature
    internal: true
    #restore_data: true

  - platform: homeassistant
