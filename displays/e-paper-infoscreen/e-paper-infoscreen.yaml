# Display
##

#lvgl:
#  widgets:
#    - label:
#        align: CENTER
#        text: 'Hello World!'

display:
  - platform: inkplate
    id: inkplate_display
    model: inkplate_10
    #greyscale: True
    partial_updating: True
    auto_clear_enabled: False
    update_interval: never
    #update_interval: 1min
    full_update_every: 0
    #full_update_every: 480

    ckv_pin: 32
    sph_pin: 33
    gmod_pin:
      pca6416a: pca6416a_hub
      number: 1
    gpio0_enable_pin:
      pca6416a: pca6416a_hub
      number: 8
    oe_pin:
      pca6416a: pca6416a_hub
      number: 0
    spv_pin:
      pca6416a: pca6416a_hub
      number: 2
    powerup_pin:
      pca6416a: pca6416a_hub
      number: 4
    wakeup_pin:
      pca6416a: pca6416a_hub
      number: 3
    vcom_pin:
      pca6416a: pca6416a_hub
      number: 5
    pages:
      # welcome screen is first, so it's the default page if anything draws early
      - id: ss_logo
        lambda: |-
          it.fill(COLOR_ON);
          it.image(it.get_width()/2, it.get_height()/2, id(ss_logo_big_black), ImageAlign::CENTER);
          it.printf(it.get_width()/2, 100, id(medium), COLOR_OFF, TextAlign::CENTER, "Welcome to");
          //it.strftime(it.get_width()/2, 800, id(helvetica_48), COLOR_OFF, TextAlign::CENTER, "%A, %B %d %Y", id(esptime).now());
      - id: whitepage
        lambda: |-
          it.fill(COLOR_ON);
      - id: weather_page1
        lambda: |-
          // Layout (1200 x 825):
          //   header  y   0-200  current temp + the day's outlook (stays put)
          //   body    y 210-745  rotates every 10 min through the eligible pages
          //   footer  y 755-825  spa, page dots, date
          it.fill(COLOR_ON);
          const int W = it.get_width();

          // NaN-safe number formatting: show "--" for any value that hasn't loaded
          auto f0 = [](float v) -> std::string { return std::isnan(v) ? std::string("--") : str_sprintf("%.0f", v); };

          // Map weather states to MDI characters.
          std::map<std::string, std::string> icon
          {
            {"cloudy", "\U000F0590"},
            {"cloudy-alert", "\U000F0F2F"},
            {"exceptional", "\U000F0F2F"},
            {"cloudy-arrow-right", "\U000F0E6E"},
            {"fog", "\U000F0591"},
            {"hail", "\U000F0592"},
            {"hazy", "\U000F0F30"},
            {"hurricane", "\U000F0898"},
            {"lightning", "\U000F0593"},
            {"lightning-rainy", "\U000F067E"},
            {"clear-night", "\U000F0594"},
            {"night-partly-cloudy", "\U000F0F31"},
            {"partlycloudy", "\U000F0595"},
            {"partly-lightning", "\U000F0F32"},
            {"partly-rainy", "\U000F0F33"},
            {"partly-snowy", "\U000F0F34"},
            {"partly-snowy-rainy", "\U000F0F35"},
            {"pouring", "\U000F0596"},
            {"rainy", "\U000F0597"},
            {"snowy", "\U000F0598"},
            {"snowy-heavy", "\U000F0F36"},
            {"snowy-rainy", "\U000F067F"},
            {"sunny", "\U000F0599"},
            {"sunny-alert", "\U000F0F37"},
            {"sunny-off", "\U000F14E4"},
            {"sunset", "\U000F059A"},
            {"sunset-down", "\U000F059B"},
            {"sunset-up", "\U000F059C"},
            {"tornado", "\U000F0F38"},
            {"windy", "\U000F059D"},
            {"windy-variant", "\U000F059E"},
            {"connected", "\U000F05A9"},
            {"disconnected", "\U000F05AA"},
            {"bot", "\U000F171A"},
            {"hot-tub", "\U000F0828"},
            {"lightbulb", "\U000F0335"},
            {"waterfall", "\U000F1849"},
            {"heating", "\U000F1A45"},
            {"cooling", "\U000F0717"},
            {"cleaning", "\U000F0D43"},
          };

          // HA condition -> readable words
          auto pretty = [](std::string c) -> std::string {
            if (c == "partlycloudy") return "Partly cloudy";
            if (c == "clear-night") return "Clear";
            if (c == "lightning-rainy") return "Thunderstorms";
            if (c == "snowy-rainy") return "Wintry mix";
            if (c == "windy-variant") return "Windy";
            if (c == "exceptional") return "Severe weather";
            if (c.empty() || c == "unknown" || c == "unavailable") return "";
            if (c[0] >= 'a' && c[0] <= 'z') c[0] -= 32;
            return c;
          };

          auto text_w = [&](const std::string &t, font::Font *f) -> int {
            int x1, y1, w, h;
            it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
            return w;
          };

          // word-wrap text into a box, at most max_lines lines
          auto draw_wrapped = [&](const std::string &txt, int x, int y, int max_w, int line_h, int max_lines, font::Font *f) {
            std::string line;
            int n = 0;
            size_t i = 0;
            while (i <= txt.size() && n < max_lines) {
              size_t sp = txt.find(' ', i);
              if (sp == std::string::npos) sp = txt.size();
              std::string word = txt.substr(i, sp - i);
              std::string cand = line.empty() ? word : line + " " + word;
              if (!line.empty() && text_w(cand, f) > max_w) {
                it.print(x, y + n * line_h, f, COLOR_OFF, TextAlign::TOP_LEFT, line.c_str());
                n++;
                line = word;
              } else {
                line = cand;
              }
              i = sp + 1;
            }
            if (n < max_lines && !line.empty())
              it.print(x, y + n * line_h, f, COLOR_OFF, TextAlign::TOP_LEFT, line.c_str());
          };

          // Which body pages have data right now. Keep in sync with the
          // 10-minute rotation interval. Seasonal pages get added here.
          const int NUM_PAGES = 4;
          bool page_ok[NUM_PAGES] = {
            true,                                                                      // 0: today (AI forecast + hourly)
            id(d1_conditions).has_state() && !std::isnan(id(d1_temp_high).state),      // 1: 5-day
            id(hikes_ok).state,                                                        // 2: hikes (no snow)
            id(santa_soon),                                                            // 3: Santa's Village (open within 3 days)
          };
          // HA page override (input_select.e_ink_page) pins a page, in season or not
          int forced = -1;
          {
            const std::string &o = id(page_override).state;
            if (o == "today") forced = 0; else if (o == "5-day") forced = 1; else if (o == "hikes") forced = 2;
            else if (o == "santa") forced = 3;
          }
          if (forced >= 0) page_ok[forced] = true;
          int page = forced >= 0 ? forced : id(page_idx);
          if (page < 0 || page >= NUM_PAGES || !page_ok[page]) page = 0;

          auto now = id(esptime).now();

          // ===== header: right now + the day's outlook ==========================
          std::string cond = id(cur_conditions).state;
          it.printf(100, 82, id(font_mdi_header), COLOR_OFF, TextAlign::CENTER, "%s", icon[cond].c_str());
          it.printf(100, 165, id(label), COLOR_OFF, TextAlign::TOP_CENTER, "%s", pretty(cond).c_str());
          it.printf(205, 8, id(big), COLOR_OFF, TextAlign::TOP_LEFT, "%s°", f0(id(cur_temp).state).c_str());
          it.printf(215, 145, id(label), COLOR_OFF, TextAlign::TOP_LEFT, "Feels like %s°", f0(id(cur_realfeel_temp).state).c_str());

          // the day's outlook: today until 5 PM, then tomorrow
          bool evening = now.is_valid() && now.hour >= 17;
          text_sensor::TextSensor *o_cond = evening ? id(d1_conditions) : id(d0_conditions);
          sensor::Sensor *o_hi  = evening ? id(d1_temp_high) : id(d0_temp_high);
          sensor::Sensor *o_lo  = evening ? id(d1_temp_low)  : id(d0_temp_low);
          sensor::Sensor *o_pop = evening ? id(d1_precip_prob) : id(d0_precip_prob);
          const int ox = 495;
          it.printf(ox, 14, id(small), COLOR_OFF, TextAlign::TOP_LEFT, "%s", evening ? "TOMORROW" : "TODAY");
          std::string outlook = pretty(o_cond->state);
          if (!std::isnan(o_pop->state))
            outlook += (outlook.empty() ? "" : " · ") + f0(o_pop->state) + "% precip";
          it.printf(ox, 56, id(label), COLOR_OFF, TextAlign::TOP_LEFT, "%s", outlook.c_str());
          it.printf(ox, 92, id(label), COLOR_OFF, TextAlign::TOP_LEFT, "High %s° · Low %s°", f0(o_hi->state).c_str(), f0(o_lo->state).c_str());
          it.printf(ox, 128, id(label), COLOR_OFF, TextAlign::TOP_LEFT, "Wind %s mph %s", f0(id(current_wind_speed).state).c_str(), id(current_wind_direction).state.c_str());

          it.image(W - 30, 15, id(ss_logo_black), ImageAlign::TOP_RIGHT);
          it.filled_rectangle(30, 200, W - 60, 2, COLOR_OFF);

          // ===== body ===========================================================
          if (page == 0) {
            // Today: AI 8-hour forecast + the next five hours
            std::string s = id(cur_forecast).state;
            if (!s.empty() && s != "unknown" && s != "unavailable") {
              it.printf(30, 220, id(font_mdi_medium), COLOR_OFF, TextAlign::TOP_LEFT, "%s", icon["bot"].c_str());
              draw_wrapped(s, 85, 224, W - 85 - 30, 32, 3, id(label));
            }
            text_sensor::TextSensor *hours[5] = {id(h1_hour), id(h2_hour), id(h3_hour), id(h4_hour), id(h5_hour)};
            text_sensor::TextSensor *conds[5] = {id(h1_conditions), id(h2_conditions), id(h3_conditions), id(h4_conditions), id(h5_conditions)};
            sensor::Sensor *temps[5] = {id(h1_temp), id(h2_temp), id(h3_temp), id(h4_temp), id(h5_temp)};
            for (int k = 0; k < 5; k++) {
              int cx = 120 + 240 * k;
              it.printf(cx, 360, id(small), COLOR_OFF, TextAlign::TOP_CENTER, "%s", hours[k]->state.c_str());
              it.printf(cx, 395, id(font_mdi_large), COLOR_OFF, TextAlign::TOP_CENTER, "%s", icon[conds[k]->state].c_str());
              it.printf(cx, 590, id(small), COLOR_OFF, TextAlign::TOP_CENTER, "%s°", f0(temps[k]->state).c_str());
            }
          } else if (page == 1) {
            // 5-day forecast
            static const char *DAYS[7] = {"Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"};
            text_sensor::TextSensor *dc[5] = {id(d0_conditions), id(d1_conditions), id(d2_conditions), id(d3_conditions), id(d4_conditions)};
            sensor::Sensor *hi[5]  = {id(d0_temp_high), id(d1_temp_high), id(d2_temp_high), id(d3_temp_high), id(d4_temp_high)};
            sensor::Sensor *lo[5]  = {id(d0_temp_low), id(d1_temp_low), id(d2_temp_low), id(d3_temp_low), id(d4_temp_low)};
            sensor::Sensor *pop[5] = {id(d0_precip_prob), id(d1_precip_prob), id(d2_precip_prob), id(d3_precip_prob), id(d4_precip_prob)};
            for (int k = 0; k < 5; k++) {
              int cx = 120 + 240 * k;
              std::string name = k == 0 ? std::string("Today")
                               : (now.is_valid() ? std::string(DAYS[(now.day_of_week - 1 + k) % 7]) : str_sprintf("Day %d", k + 1));
              it.printf(cx, 225, id(small), COLOR_OFF, TextAlign::TOP_CENTER, "%s", name.c_str());
              it.printf(cx, 265, id(font_mdi_large), COLOR_OFF, TextAlign::TOP_CENTER, "%s", icon[dc[k]->state].c_str());
              it.printf(cx, 465, id(medium), COLOR_OFF, TextAlign::TOP_CENTER, "%s°", f0(hi[k]->state).c_str());
              it.printf(cx, 540, id(small), COLOR_OFF, TextAlign::TOP_CENTER, "low %s°", f0(lo[k]->state).c_str());
              if (!std::isnan(pop[k]->state))
                it.printf(cx, 585, id(label), COLOR_OFF, TextAlign::TOP_CENTER, "%s%% precip", f0(pop[k]->state).c_str());
            }
          } else if (page == 2) {
            // Hikes from our AllTrails list, nearest first by drive from the
            // house; six per set, the next set each time this page comes up.
            // Set 1 is the six highlights.
            struct Hike { const char *name, *town, *drive, *dist, *route, *level, *url; };
            static const Hike HIKES[17] = {
              {"Prospect Mountain", "Lancaster", "7 min", "3.6 mi", "loop", "moderate", "https://www.alltrails.com/trail/us/new-hampshire/prospect-mountain-trail"},
              {"Prospect Big Loop", "Lancaster", "7 min", "3.0 mi", "loop", "moderate", "https://www.alltrails.com/trail/us/new-hampshire/prospect-mountain-big-loop"},
              {"Waumbek & Starr King", "Jefferson", "21 min", "7.0 mi", "out & back", "hard", "https://www.alltrails.com/trail/us/new-hampshire/mount-waumbek-and-mount-starr-king-trail"},
              {"The Mooseway", "Jefferson", "23 min", "3.2 mi", "out & back", "easy", "https://www.alltrails.com/trail/us/new-hampshire/the-mooseway"},
              {"Mud Pond", "Jefferson", "23 min", "1.1 mi", "out & back", "easy", "https://www.alltrails.com/trail/us/new-hampshire/mud-pond-trail"},
              {"Gold Mine Trail", "Whitefield", "23 min", "1.8 mi", "out & back", "easy", "https://www.alltrails.com/trail/us/new-hampshire/gold-mine-trail"},
              {"Colonel Whipple", "Jefferson", "24 min", "4.4 mi", "out & back", "easy", "https://www.alltrails.com/trail/us/new-hampshire/colonel-whipple-trail"},
              {"Owl's Head / Martha's Mile", "Jefferson", "28 min", "6.2 mi", "out & back", "hard", "https://www.alltrails.com/trail/us/new-hampshire/owls-head-trail-to-marthas-mile"},
              {"Pondicherry Refuge", "Whitefield", "29 min", "4.8 mi", "out & back", "easy", "https://www.alltrails.com/trail/us/new-hampshire/pondicherry-nature-refuge-via-presidential-range-rail-trail"},
              {"Cow Mountain", "Granby, VT", "32 min", "3.2 mi", "out & back", "moderate", "https://www.alltrails.com/trail/us/vermont/cow-mountain-trail"},
              {"Devil's Slide", "Groveton", "38 min", "1.7 mi", "out & back", "moderate", "https://www.alltrails.com/trail/us/new-hampshire/devils-slide-trail"},
              {"Mount Willard", "Bretton Woods", "42 min", "3.2 mi", "out & back", "moderate", "https://www.alltrails.com/trail/us/new-hampshire/mount-willard"},
              {"Mount Garfield", "Bethlehem", "42 min", "9.8 mi", "out & back", "hard", "https://www.alltrails.com/trail/us/new-hampshire/mount-garfield-trail"},
              {"Victor Head", "Groveton", "44 min", "4.7 mi", "out & back", "moderate", "https://www.alltrails.com/trail/us/new-hampshire/victor-head"},
              {"Bridesmaid Falls", "Franconia", "51 min", "1.0 mi", "out & back", "moderate", "https://www.alltrails.com/trail/us/new-hampshire/bridesmaid-falls"},
              {"North Percy", "North Stratford", "51 min", "4.1 mi", "out & back", "hard", "https://www.alltrails.com/trail/us/new-hampshire/north-percy-trail"},
              {"Table Rock", "Dixville Notch", "78 min", "1.5 mi", "out & back", "moderate", "https://www.alltrails.com/trail/us/new-hampshire/table-rock-dixville-notch"},
            };
            static const int SETS[3][6] = {{0, 2, 5, 3, 7, 8}, {1, 4, 6, 9, 10, 11}, {12, 13, 14, 15, 16, -1}};
            int set = id(hike_set) % 3;
            if (set < 0) set = 0;

            it.print(30, 216, id(small), COLOR_OFF, TextAlign::TOP_LEFT, "HIKES NEAR THE HOUSE");
            it.printf(1008, 222, id(label), COLOR_OFF, TextAlign::TOP_RIGHT, "nearest first · set %d of 3", set + 1);

            for (int k = 0; k < 6; k++) {
              int idx = SETS[set][k];
              if (idx < 0) continue;
              const Hike &h = HIKES[idx];
              const int cw = 318, ch = 228;
              int x = 30 + (k % 3) * (cw + 12), y = 262 + (k / 3) * (ch + 16);
              it.rectangle(x, y, cw, ch, COLOR_OFF);
              it.rectangle(x + 1, y + 1, cw - 2, ch - 2, COLOR_OFF);
              font::Font *tf = text_w(h.name, id(card_title)) <= cw - 32 ? id(card_title) : id(card_title_sm);
              it.print(x + 16, y + 14, tf, COLOR_OFF, TextAlign::TOP_LEFT, h.name);
              it.print(x + 16, y + 48, id(tiny), COLOR_OFF, TextAlign::TOP_LEFT, h.town);
              // drive time from the house, white on black
              it.filled_rectangle(x + 16, y + 84, 112, 38, COLOR_OFF);
              it.print(x + 72, y + 103, id(label), COLOR_ON, TextAlign::CENTER, h.drive);
              it.print(x + 16, y + 140, id(tiny), COLOR_OFF, TextAlign::TOP_LEFT, h.dist);
              it.print(x + 16, y + 164, id(tiny), COLOR_OFF, TextAlign::TOP_LEFT, h.route);
              it.print(x + 16, y + 188, id(tiny), COLOR_OFF, TextAlign::TOP_LEFT, h.level);
              id(qr_dyn).set_value(h.url);
              it.qr_code(x + cw - 135, y + ch - 135, id(qr_dyn), COLOR_OFF, 3);
            }

            // the whole list
            const int lx = 1020, lw = 150, ly = 262, lh = 472;
            it.rectangle(lx, ly, lw, lh, COLOR_OFF);
            it.rectangle(lx + 1, ly + 1, lw - 2, lh - 2, COLOR_OFF);
            it.printf(lx + lw / 2, ly + 18, id(font_mdi_medium), COLOR_OFF, TextAlign::TOP_CENTER, "%s", "\U000F0D7F");
            it.print(lx + lw / 2, ly + 72, id(label), COLOR_OFF, TextAlign::TOP_CENTER, "OUR LIST");
            it.print(lx + lw / 2, ly + 108, id(tiny), COLOR_OFF, TextAlign::TOP_CENTER, "17 hikes");
            it.print(lx + lw / 2, ly + 132, id(tiny), COLOR_OFF, TextAlign::TOP_CENTER, "we love");
            it.qr_code(lx + 20, ly + 172, id(qr_hike_list), COLOR_OFF, 3);
            it.print(lx + lw / 2, ly + 310, id(tiny), COLOR_OFF, TextAlign::TOP_CENTER, "Scan for");
            it.print(lx + lw / 2, ly + 334, id(tiny), COLOR_OFF, TextAlign::TOP_CENTER, "all of them");
          } else if (page == 3) {
            // Santa's Village: the next open days from the season schedule
            // (globals santa_days, YYYYMMDDHHhh = date, open hour, close hour)
            static const char *DOW[7] = {"SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"};
            static const char *DOW3[7] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
            static const char *MON[12] = {"JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"};
            static const char *MON3[12] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
            auto hr = [](int h) -> std::string {
              int h12 = h % 12 == 0 ? 12 : h % 12;
              return str_sprintf("%d %s", h12, h < 12 ? "AM" : "PM");
            };
            struct Day { ESPTime t; int open, close; };
            std::vector<Day> upcoming;
            if (now.is_valid()) {
              uint32_t today = now.year * 10000 + now.month * 100 + now.day_of_month;
              for (uint64_t e : id(santa_days)) {
                uint32_t date = e / 10000;
                int open = (e / 100) % 100, close = e % 100;
                if (date < today || (date == today && now.hour >= close)) continue;
                ESPTime t{};
                // find the weekday by walking from today (schedule is weeks, not years)
                for (int d = 0; d < 60; d++) {
                  ESPTime c = ESPTime::from_epoch_local(now.timestamp + d * 86400);
                  if ((uint32_t) (c.year * 10000 + c.month * 100 + c.day_of_month) == date) { t = c; break; }
                }
                if (!t.is_valid()) continue;
                upcoming.push_back({t, open, close});
              }
            }

            it.print(30, 216, id(small), COLOR_OFF, TextAlign::TOP_LEFT, "SANTA'S VILLAGE");
            it.print(1170, 222, id(label), COLOR_OFF, TextAlign::TOP_RIGHT, "Jefferson, NH");
            it.printf(130, 270, id(font_mdi_large), COLOR_OFF, TextAlign::TOP_CENTER, "%s", "\U000F0405");
            it.print(260, 272, id(small), COLOR_OFF, TextAlign::TOP_LEFT, "CHRISTMASTIME");
            if (upcoming.empty()) {
              it.print(260, 316, id(label), COLOR_OFF, TextAlign::TOP_LEFT, "Closed for the season");
            } else {
              const ESPTime &t0 = upcoming[0].t;
              bool is_today = t0.day_of_month == now.day_of_month && t0.month == now.month;
              ESPTime tom = ESPTime::from_epoch_local(now.timestamp + 86400);
              bool is_tom = t0.day_of_month == tom.day_of_month && t0.month == tom.month;
              std::string status = is_today ? "Open today" : is_tom ? "Open tomorrow" : std::string("Next open ") + DOW3[t0.day_of_week - 1];
              it.print(260, 316, id(label), COLOR_OFF, TextAlign::TOP_LEFT, status.c_str());
              // the next two open days: the first white on black
              for (int k = 0; k < 2 && k < (int) upcoming.size(); k++) {
                const Day &d = upcoming[k];
                int y = 370 + k * 140;
                Color fg = k == 0 ? COLOR_ON : COLOR_OFF;
                if (k == 0) it.filled_rectangle(260, y, 540, 124, COLOR_OFF);
                else { it.rectangle(260, y, 540, 124, COLOR_OFF); it.rectangle(261, y + 1, 538, 122, COLOR_OFF); }
                it.printf(284, y + 14, id(small), fg, TextAlign::TOP_LEFT, "%s, %s %d", DOW[d.t.day_of_week - 1], MON[d.t.month - 1], d.t.day_of_month);
                it.printf(284, y + 52, id(medium), fg, TextAlign::TOP_LEFT, "%s – %s", hr(d.open).c_str(), hr(d.close).c_str());
              }
              // then the rest, briefly
              std::string more;
              for (int k = 2; k < 5 && k < (int) upcoming.size(); k++) {
                const ESPTime &t = upcoming[k].t;
                if (!more.empty()) more += " · ";
                more += str_sprintf("%s %s %d", DOW3[t.day_of_week - 1], MON3[t.month - 1], t.day_of_month);
              }
              if (!more.empty())
                it.print(260, 660, id(label), COLOR_OFF, TextAlign::TOP_LEFT, ("Then: " + more).c_str());
              // last regular day, and the New Year's Eve party (the 4 PM opening)
              std::string tail;
              const Day *last = nullptr, *nye = nullptr;
              for (const Day &d : upcoming) { if (d.open >= 16) nye = &d; else last = &d; }
              if (last != nullptr)
                tail = str_sprintf("Last Christmastime day: %s %s %d", DOW3[last->t.day_of_week - 1], MON3[last->t.month - 1], last->t.day_of_month);
              if (nye != nullptr)
                tail += str_sprintf("%sNew Year's Eve party %s %d, %s – %s", tail.empty() ? "" : " · ",
                                    MON3[nye->t.month - 1], nye->t.day_of_month, hr(nye->open).c_str(), hr(nye->close).c_str());
              it.print(260, 698, id(tiny), COLOR_OFF, TextAlign::TOP_LEFT, tail.c_str());
            }
            // QR codes: tickets (sold online by date) and the park calendar
            id(qr_dyn).set_value("https://secure.interactiveticketing.com/1.43/faaba3/");
            it.qr_code(850, 300, id(qr_dyn), COLOR_OFF, 4);
            it.print(908, 448, id(label), COLOR_OFF, TextAlign::TOP_CENTER, "Tickets");
            id(qr_dyn).set_value("https://www.santasvillage.com/park-info-tickets/dates-hours");
            it.qr_code(1030, 300, id(qr_dyn), COLOR_OFF, 4);
            it.print(1096, 448, id(label), COLOR_OFF, TextAlign::TOP_CENTER, "Hours");
            it.print(1005, 520, id(tiny), COLOR_OFF, TextAlign::TOP_CENTER, "All-day $60, ages 4+");
            it.print(1005, 546, id(tiny), COLOR_OFF, TextAlign::TOP_CENTER, "twilight tickets too");
          }

          // ===== footer: spa, page dots, date ===================================
          it.filled_rectangle(30, 752, W - 60, 2, COLOR_OFF);
          it.printf(30, 764, id(font_mdi_medium), COLOR_OFF, TextAlign::TOP_LEFT, "%s", icon["hot-tub"].c_str());
          // the person in the tub only shows while it's in use (light on, or jets
          // running outside the filter cycle). The original 225 px icon centered at
          // (450,655) blanked the box (360,574) 85x80; scale that box to this icon.
          bool tub_in_use = id(hottub_light).state || (id(hottub_pump).state && !id(hottub_cleaning).state);
          if (!tub_in_use) {
            int hx, hy, hw, hh, sx, sy, sw, sh;
            it.get_text_bounds(450, 655, icon["hot-tub"].c_str(), id(font_mdi_huge), TextAlign::CENTER, &hx, &hy, &hw, &hh);
            it.get_text_bounds(30, 764, icon["hot-tub"].c_str(), id(font_mdi_medium), TextAlign::TOP_LEFT, &sx, &sy, &sw, &sh);
            if (hw > 0 && hh > 0)
              it.filled_rectangle(sx + (360 - hx) * sw / hw, sy + (574 - hy) * sh / hh,
                                  (85 * sw + hw - 1) / hw, (80 * sh + hh - 1) / hh, COLOR_ON);
          }
          std::string spa = "Spa " + f0(id(hottub_temp).state) + "°  set " + f0(id(hottub_setpoint).state) + "°";
          it.printf(80, 769, id(small), COLOR_OFF, TextAlign::TOP_LEFT, "%s", spa.c_str());
          int ix = 80 + text_w(spa, id(small)) + 18;
          if (id(hottub_action).state == "heating") { it.printf(ix, 764, id(font_mdi_medium), COLOR_OFF, TextAlign::TOP_LEFT, "%s", icon["heating"].c_str()); ix += 46; }
          if (id(hottub_pump).state)     { it.printf(ix, 764, id(font_mdi_medium), COLOR_OFF, TextAlign::TOP_LEFT, "%s", icon["waterfall"].c_str()); ix += 46; }
          if (id(hottub_light).state)    { it.printf(ix, 764, id(font_mdi_medium), COLOR_OFF, TextAlign::TOP_LEFT, "%s", icon["lightbulb"].c_str()); ix += 46; }
          if (id(hottub_cleaning).state) { it.printf(ix, 764, id(font_mdi_medium), COLOR_OFF, TextAlign::TOP_LEFT, "%s", icon["cleaning"].c_str()); ix += 46; }

          int n_ok = 0;
          for (int p = 0; p < NUM_PAGES; p++) if (page_ok[p]) n_ok++;
          if (n_ok > 1) {
            int dx = W / 2 - (n_ok - 1) * 14, d = 0;
            for (int p = 0; p < NUM_PAGES; p++) {
              if (!page_ok[p]) continue;
              if (p == page) it.filled_circle(dx + d * 28, 788, 7, COLOR_OFF);
              else it.circle(dx + d * 28, 788, 7, COLOR_OFF);
              d++;
            }
          }

          // date, or an offline note if HA has been unreachable for 30+ minutes
          // (no clock: a minute-by-minute timestamp forced a redraw every minute)
          bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (!api_ok && millis() - id(last_api_ok_ms) > 30UL * 60UL * 1000UL) {
            if (id(last_api_ok_str).empty())
              it.printf(W - 70, 774, id(label), COLOR_OFF, TextAlign::TOP_RIGHT, "offline");
            else
              it.printf(W - 70, 774, id(label), COLOR_OFF, TextAlign::TOP_RIGHT, "offline since %s", id(last_api_ok_str).c_str());
          } else if (now.is_valid()) {
            it.printf(W - 70, 774, id(label), COLOR_OFF, TextAlign::TOP_RIGHT, "%s %d", now.strftime("%A, %B").c_str(), now.day_of_month);
          }
          if (id(system_status).state)
            it.printf(W - 40, 800, id(font_mdi_small), COLOR_OFF, TextAlign::BOTTOM_LEFT, "%s", icon["connected"].c_str());
          else
            it.printf(W - 40, 800, id(font_mdi_small), COLOR_OFF, TextAlign::BOTTOM_LEFT, "%s", icon["disconnected"].c_str());

#display_capture:
#  display_id: inkplate_display
#  backend: inkplate

interval:
  - interval: 60s
    then:
      - script.execute: mainLoop
      # woke from a night / vacant sleep but HA is unreachable: don't burn the
      # battery waiting, nap again (the screen keeps showing the last frame)
      - if:
          condition:
            lambda: |-
              return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_TIMER &&
                     millis() > 3UL * 60UL * 1000UL &&
                     !(api::global_api_server != nullptr && api::global_api_server->is_connected());
          then:
            - logger.log: "e-ink display - no HA after waking, sleeping again"
            - text_sensor.template.publish:
                id: sleep_state
                state: "Sleeping (no HA)"
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: 30min

  - interval: 3h
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - script.execute: fetch_snow

  # rotate the body to the next page that has data every 10 minutes
  - interval: 10min
    then:
      - script.execute: next_page

# IR blaster (LED candles, fireplace). GPIO13: GPIO12 is a boot strapping pin
# (pulled high at power-on it stops the ESP32 booting). GPIO12-15 are the
# microSD slot's pins, so the SD card is not used.
remote_transmitter:
  pin: GPIO13
  # 20% as on the dev board where the codes were tested
  carrier_duty_percent: 20%
  # non-blocking (the default since 2025.11): a code still on the wire is
  # finished before the next one starts. Blocking mode waits on the RMT driver
  # in the main loop and the frame dropped off the network on the first send.
  non_blocking: true
#  pin:
#    pca6416a: pca6416a_hub2
#    number: 1

## Main Loop
script:
#  - id: fullRefreshCheck
#    then:
#      - if:
#        condition:
#        refresh_count

  # advance the body to the next page that has data, then redraw.
  # Keep the eligibility checks in sync with page_ok[] in the weather_page1 lambda.
  - id: next_page
    then:
      - lambda: |-
          const int NUM_PAGES = 4;
          bool page_ok[NUM_PAGES] = {
            true,
            id(d1_conditions).has_state() && !std::isnan(id(d1_temp_high).state),
            id(hikes_ok).state,
            id(santa_soon),
          };
          int forced = -1;
          {
            const std::string &o = id(page_override).state;
            if (o == "today") forced = 0; else if (o == "5-day") forced = 1; else if (o == "hikes") forced = 2;
            else if (o == "santa") forced = 3;
          }
          if (forced >= 0) {
            // pinned from HA: stay on it, and step through its sets
            id(page_idx) = forced;
            if (forced == 2) id(hike_set) = (id(hike_set) + 1) % 3;
            id(draw_now) = true;
            return;
          }
          for (int step = 1; step <= NUM_PAGES; step++) {
            int p = (id(page_idx) + step) % NUM_PAGES;
            if (page_ok[p]) { id(page_idx) = p; break; }
          }
          // each visit to the hiking page shows the next six trails
          if (id(page_idx) == 2) id(hike_set) = (id(hike_set) + 1) % 3;
          id(draw_now) = true;
      - script.execute: mainLoop

  # snow depth at the house from Open-Meteo (meters -> inches)
  - id: fetch_snow
    mode: single
    then:
      - http_request.get:
          url: "https://api.open-meteo.com/v1/forecast?latitude=44.4605&longitude=-71.5955&current=snow_depth"
          capture_response: true
          max_response_buffer_size: 2kB
          on_response:
            then:
              - lambda: |-
                  if (response->status_code != 200) {
                    ESP_LOGW("snow", "Open-Meteo HTTP %d", response->status_code);
                    return;
                  }
                  bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                    JsonVariant d = root["current"]["snow_depth"];
                    if (d.isNull()) return false;
                    id(snow_depth_in).publish_state(d.as<float>() * 39.37f);
                    return true;
                  });
                  if (!ok) ESP_LOGW("snow", "no snow_depth in Open-Meteo response");
          on_error:
            then:
              - logger.log: "snow depth fetch failed"

  # a press of the WAKE or frame button: flip the page and stay awake 10 minutes
  # (even at night or between guests - someone is standing in front of it)
  - id: button_flip
    then:
      - logger.log: "e-ink display - button pressed, next page"
      - lambda: 'id(awake_until_ms) = millis() + 10UL * 60UL * 1000UL;'
      - script.execute: next_page

  # every minute while awake, and right after boot / wake: draw if needed, then
  # deep sleep if HA says it is night (everyone in bed) or the house is vacant
  - id: mainLoop
    then:
      - lambda: |-
          bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
          if (api_ok) {
            id(last_api_ok_ms) = millis();
            auto t = id(esptime).now();
            if (t.is_valid())
              id(last_api_ok_str) = t.strftime("%a %I:%M %p");
          }
          ESP_LOGD("main", "mode %s (sleep %.0fs), api %s, weather %s, main floor %s, button hold %s",
                   id(power_mode).has_state() ? id(power_mode).state.c_str() : "?",
                   id(sleep_seconds).state, api_ok ? "up" : "down",
                   id(weather_data_ready).state ? "ready" : "not ready",
                   id(main_floor_recent).state ? "active" : "quiet",
                   millis() < id(awake_until_ms) ? "yes" : "no");
      - component.update: battery_voltage

      # what to do this pass: mode = awake / night / vacant. A recent button
      # press keeps it awake. Sleeping needs HA connected (it decides).
      - lambda: |-
          bool api_ok = api::global_api_server != nullptr && api::global_api_server->is_connected();
          std::string m = id(power_mode).has_state() ? id(power_mode).state : "awake";
          if (!api_ok || millis() < id(awake_until_ms) || (m != "night" && m != "vacant"))
            m = "awake";
          id(eff_mode) = m;
          // Santa's Village page: open later today, or in the next 3 days
          {
            bool soon = false;
            auto now = id(esptime).now();
            if (now.is_valid()) {
              for (int d = 0; d <= 3 && !soon; d++) {
                ESPTime c = ESPTime::from_epoch_local(now.timestamp + d * 86400);
                uint64_t key = (uint64_t) c.year * 10000 + c.month * 100 + c.day_of_month;
                for (uint64_t e : id(santa_days))
                  if (e / 10000 == key && (d > 0 || now.hour < (int) (e % 100))) { soon = true; break; }
              }
            }
            id(santa_soon) = soon;
          }
          // snow depth for the seasonal pages: fetch while awake until we have one
          if (m == "awake" && api_ok && !id(snow_depth_in).has_state() &&
              (id(snow_try_ms) == 0 || millis() - id(snow_try_ms) > 10UL * 60UL * 1000UL)) {
            id(snow_try_ms) = millis();
            id(fetch_snow).execute();
          }
          id(sleep_after_draw) = m != "awake" && !std::isnan(id(sleep_seconds).state) &&
                                 id(sleep_seconds).state >= 60;
          if (id(sleep_after_draw)) {
            id(draw_now) = true;
            // night: the 5-day forecast (tomorrow's day is in the header)
            if (m == "night" && id(d1_conditions).has_state() && !std::isnan(id(d1_temp_high).state))
              id(page_idx) = 1;
          }

      # between guests: welcome screen
      - if:
          condition:
            lambda: 'return id(eff_mode) == "vacant";'
          then:
            - logger.log: "e-ink display - vacant, welcome screen"
            - if:
                condition:
                  lambda: 'return !id(initial_draw_done) || !id(main_floor_recent).state;'
                then:
                  - lambda: id(inkplate_display).block_partial();
            - display.page.show: ss_logo
            - component.update: inkplate_display
            - globals.set:
                id: initial_draw_done
                value: 'true'
            - globals.set:
                id: draw_now
                value: 'false'

      # weather: when HA data is in, and connected (or offline long enough that
      # the page should say so). Redrawing an unchanged page is a no-op (partial
      # update, no pixels change).
      - if:
          condition:
            - lambda: 'return id(eff_mode) != "vacant";'
            - binary_sensor.is_on: weather_data_ready
            - lambda: |-
                return (api::global_api_server != nullptr && api::global_api_server->is_connected()) ||
                       millis() - id(last_api_ok_ms) > 30UL * 60UL * 1000UL;
            # someone on the main floor in the last hour, or a redraw was asked
            # for (boot, page change, button, motion, going to sleep). Otherwise
            # skip this minute.
            - lambda: 'return id(main_floor_recent).state || !id(initial_draw_done) || id(draw_now);'
          then:
            - logger.log: "e-ink display - showing weather page"
            - component.update: current_wind_direction
            # Full refresh (clears ghosting) only when nobody will see the flash:
            # - first draw after a cold boot (wipes the welcome screen)
            # - awake: nobody on the main floor for an hour
            # - night: once, on the 3am wake (night redraws are otherwise quiet
            #   partial updates against the frame restored from flash)
            - if:
                condition:
                  lambda: |-
                    if (!id(initial_draw_done)) return true;
                    if (id(eff_mode) == "night") {
                      auto t = id(esptime).now();
                      return t.is_valid() && t.hour == 3;
                    }
                    return !id(main_floor_recent).state;
                then:
                  - logger.log: "e-ink display - full refresh"
                  - lambda: id(inkplate_display).block_partial();
            - display.page.show: weather_page1
            - component.update: inkplate_display
            - globals.set:
                id: initial_draw_done
                value: 'true'
            - globals.set:
                id: draw_now
                value: 'false'

      - if:
          condition:
            lambda: 'return id(sleep_after_draw);'
          then:
            - script.execute: enter_sleep

  # deep sleep for sensor.e_ink_sleep_seconds. The driver saves the frame to
  # flash on the way down (frame_store.cpp). Wakes: timer, WAKE button (ext0),
  # frame button (ext1, armed here unless the line is held low).
  - id: enter_sleep
    then:
      - text_sensor.template.publish:
          id: sleep_state
          state: !lambda 'return id(eff_mode) == "night" ? std::string("Night sleep") : std::string("Vacant sleep");'
      - lambda: |-
          if (!id(frame_button).state)
            esp_sleep_enable_ext1_wakeup(1ULL << 39, ESP_EXT1_WAKEUP_ALL_LOW);
          ESP_LOGI("main", "deep sleep for %.0fs (%s)", id(sleep_seconds).state, id(eff_mode).c_str());
      - deep_sleep.enter:
          id: deep_sleep_1
          sleep_duration: !lambda |-
            float s = id(sleep_seconds).state;
            if (std::isnan(s) || s < 60) s = 60;
            if (s > 21600) s = 21600;
            return (uint32_t) (s * 1000);

  # ---- IR codes (pronto), from the IR receiver/transmitter dev board
  # (candle-controller.yaml), which captured and tested them.

  # LED fireplace power - a toggle. HA power-cycles the fireplace's smart plug
  # first (it comes back off), so this always turns it on.
  - id: fireplace_power_40k
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 0068 0022 0000 016D 00B4 0018 0044 0017 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0016 0018 0044 0017 0044 0017 0044 0017 0044 0017 0044 0017 0044 0017 0044 0017 0016 0018 0016 0018 0044 0017 0016 0018 0044 0017 0016 0018 0016 0018 0016 0018 0044 0017 0044 0017 0016 0018 0044 0017 0016 0018 0044 0017 0044 0017 0044 0017 0194"
      - delay: 110ms
      - remote_transmitter.transmit_pronto:
          data: "0000 0068 0002 0000 016C 005C 0017 0194"
      - delay: 110ms
      - remote_transmitter.transmit_pronto:
          data: "0000 0068 0002 0000 016C 005C 0017 0194"

  # big candles
  - id: candles_on_38k
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 0159 00AE 0015 0017 0015 0017 0015 0017 0015 0042 0015 0017 0015 0017 0015 0017 0015 0017 0015 0042 0015 0042 0015 0042 0015 0017 0015 0042 0015 0042 0015 0017 0015 0042 0015 0017 0015 0017 0015 0017 0015 0017 0015 0017 0015 0017 0015 0017 0015 0017 0015 0042 0015 0042 0015 0042 0015 0042 0015 0042 0015 0042 0015 0042 0015 0042 0015 0181"
      - delay: 110ms
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0002 0000 0159 0058 0015 0181"

  - id: candles_off_38k
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 0163 009D 0017 0015 0016 0015 0016 0014 0017 0040 0016 0015 0016 0015 0016 0014 0017 0014 0017 0040 0016 0040 0016 0040 0016 0014 0017 0040 0016 0040 0016 0014 0017 0040 0016 0014 0017 0040 0016 0014 0017 0014 0017 0014 0017 0014 0017 0014 0017 0014 0017 0040 0016 0014 0017 0040 0016 0040 0016 0040 0016 0040 0015 0041 0015 0041 0016 0181"
      - delay: 110ms
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0002 0000 0165 0048 0016 0181"
      - delay: 110ms
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0002 0000 0169 0045 0015 0181"

  # all the candles and tea lights together (the fireplace needs its plug
  # cycled first, so HA's "Ambiance on/off" scripts handle it)
  - id: ir_candles_on
    then:
      - script.execute: candles_on_38k
      - script.wait: candles_on_38k
      - delay: 400ms
      - script.execute: tealights_on
      - script.wait: tealights_on
  # everything on (candles, tea lights, fireplace) / off (candles, tea lights;
  # HA turns the fireplace off by power-cycling its plug)
  - id: ir_all_on
    mode: single
    then:
      - script.execute: ir_candles_on
      - script.wait: ir_candles_on
      - delay: 500ms
      - script.execute: fireplace_power_40k
      - script.wait: fireplace_power_40k
  - id: ir_candles_off
    then:
      - script.execute: candles_off_38k
      - script.wait: candles_off_38k
      - delay: 400ms
      - script.execute: tealights_off
      - script.wait: tealights_off

  - id: fireplace_temp
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 015B 00AE 0016 0041 0015 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0041 0015 0041 0015 0041 0015 0041 0015 0040 0016 0040 0016 0040 0016 0015 0016 0040 0016 0015 0017 0014 0016 0040 0015 0016 0018 0014 0018 0014 0018 003F 0018 0013 0019 003D 001B 003B 001B 0010 001B 003B 001C 003B 001B 003B 001B 0181"
          repeat:
            times: 5
  - id: fireplace_fire
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 015B 00AE 0016 0041 0015 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0041 0015 0041 0015 0041 0015 0040 0016 0040 0016 0040 0016 0040 0015 0041 0018 0014 0016 0040 0016 0040 0016 0040 0016 0015 0018 0013 0018 0013 0019 0012 001B 003B 001C 000F 001A 0011 001B 0010 001C 003B 001B 003B 001B 003B 001B 0181"
          repeat:
            times: 5
  - id: fireplace_timer
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 015B 00AD 0016 0041 0015 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0015 0016 0041 0015 0041 0015 0041 0015 0041 0015 0041 0017 0040 0017 0040 0018 003D 0019 0012 001B 0010 001B 003B 001B 003B 001B 0010 001B 0010 001B 0010 001B 0010 001A 003D 001A 003D 0019 0012 0019 0012 0019 003D 0019 003D 0018 003F 0017 0181"
          repeat:
            times: 5
  - id: fireplace_up
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 015B 00AD 0018 0040 0015 0015 0016 0015 0018 0014 0019 0012 0017 0015 0019 0012 0018 0014 0018 0013 0018 003F 0017 0040 0017 003F 001A 003C 001B 003B 001A 003C 001B 003B 001B 0010 001B 003B 001A 0011 001A 003D 0019 003D 0019 0012 0019 0012 0019 0012 0019 003E 0017 0014 0017 003F 0017 0014 0017 0014 0017 003F 0017 003F 0017 003F 0017 0181"
          repeat:
            times: 5
  - id: fireplace_down
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 015B 00AD 0016 0041 0015 0015 0016 0015 0017 0015 0018 0014 0016 0015 0018 0014 0018 0014 0018 0013 0018 003F 0019 003E 0019 003D 001B 003C 001B 003B 001B 003B 001D 003A 001B 003B 001B 0010 001B 003B 001A 0011 001B 0010 001A 0011 001B 0010 001B 0010 001B 0010 001B 003B 001A 0011 001B 003B 001A 003C 001A 003D 001A 003D 001A 003D 0019 0181"
          repeat:
            times: 5
  - id: tealights_on
    then:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0022 0000 0163 00AC 0018 0015 0017 0016 0017 0016 0018 0015 0018 0015 0018 0015 001A 0014 001A 0014 001A 003D 001C 003B 001B 003B 001C 003B 001B 003B 001B 003B 001B 003B 001A 003D 001A 003D 001A 0013 001A 0013 001A 0013 001A 0014 001A 0014 0019 0014 0019 0014 0019 0014 0019 003E 0018 003F 0018 003F 0019 003E 0018 003F 0018 003F 0018 003F 0018 0181"
