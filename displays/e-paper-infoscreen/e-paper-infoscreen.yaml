          it.printf(600, 50, id(tiny), COLOR_OFF, TextAlign::TOP_LEFT, "Winds %.0f Mph %s", id(current_wind_speed).state, id(current_wind_direction).state.c_str());
          //it.printf(600, 80, id(tiny), COLOR_OFF, TextAlign::TOP_LEFT, "Direction %.0f", id(current_wind_direction).state);
